name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiểm tra file web
        run: |
          test -f index.html || (echo "❌ Thiếu index.html" && exit 1)
          test -f scripts/build-site.cjs || (echo "❌ Thiếu scripts/build-site.cjs" && exit 1)
          echo "✓ Cấu trúc repo OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static site
        run: node scripts/build-site.cjs

      - name: Kiểm tra dist
        run: |
          ls -la dist/
          test -f dist/index.html
          test -f dist/js/app.js
          test -f dist/js/data-bundle.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: In URL site
        run: echo "🌐 ${{ steps.deployment.outputs.page_url }}"

# Blueprint: Render — Laravel monolith tại repo root
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: hanviet-db
    plan: free
    databaseName: hanviet
    user: hanviet

services:
  - type: web
    name: hanviet
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: 汉越学堂
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: hanviet-db
          property: connectionString
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADS_ENABLED
        value: false
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADSENSE_VERIFICATION
        sync: false
      - key: ADSENSE_AUTO_ADS
        value: true
      - key: ADSENSE_SLOT_BANNER
        sync: false
      - key: ADSENSE_SLOT_VOCAB
        sync: false
      - key: ADSENSE_SLOT_QUIZ
        sync: false
